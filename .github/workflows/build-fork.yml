name: Imagem do fork (amd64)

# Imagem da v1.1.2 + correções ainda não aceitas no repositório oficial,
# publicada no GHCR desta conta. Só amd64: é o que o servidor usa.

on:
  push:
    branches: [meganet]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_REV=${{ github.sha }}
            BUILD_VERSION=v1.1.2-meganet
          tags: |
            ghcr.io/dionegrefin-crypto/astracalls:meganet
            ghcr.io/dionegrefin-crypto/astracalls:meganet-${{ github.sha }}
